<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Punch Clock</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-soft: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
    --green: #22c55e;
    --green-hover: #16a34a;
    --red: #ef4444;
    --red-hover: #dc2626;
    --accent: #38bdf8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    color-scheme: dark;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }

  .app { width: 100%; max-width: 520px; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
  }

  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 0.85rem; }

  .icons { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 42px; height: 42px; border-radius: 10px; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn:hover { background: var(--card-soft); border-color: var(--accent); }
  .icon-btn svg { width: 20px; height: 20px; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px; margin-bottom: 24px; text-align: center;
  }
  .status {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 12px;
  }
  .status.active { color: var(--green); }
  .timer {
    font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em; margin-bottom: 6px;
  }
  .started-at { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 24px; }

  button.action {
    font-family: inherit; font-size: 1.05rem; font-weight: 600;
    border: none; border-radius: 12px; padding: 16px 24px; width: 100%;
    cursor: pointer; color: #fff;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button.action:active { transform: scale(0.98); }
  .btn-start { background: var(--green); }
  .btn-start:hover { background: var(--green-hover); }
  .btn-end { background: var(--red); }
  .btn-end:hover { background: var(--red-hover); }

  .summary { display: flex; gap: 12px; margin-bottom: 24px; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center;
  }
  .stat-value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-label {
    font-size: 0.75rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px;
  }

  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .log-header h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .log-actions { display: flex; gap: 6px; }
  .clear-btn {
    background: none; border: none; color: var(--muted);
    font-size: 0.8rem; font-weight: 500; font-family: inherit;
    cursor: pointer; padding: 6px 10px; border-radius: 8px;
  }
  .clear-btn:hover { color: var(--red); background: var(--card-soft); }
  .add-btn:hover { color: var(--accent); background: var(--card-soft); }

  .entry {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .entry-info { text-align: left; min-width: 0; }
  .entry-date { font-weight: 600; font-size: 0.95rem; }
  .entry-times { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
  .entry-bonus { color: var(--green); font-size: 0.78rem; margin-top: 3px; }
  .entry-hours {
    font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums;
    color: var(--accent); white-space: nowrap;
  }
  .entry-actions { display: flex; align-items: center; gap: 4px; }
  .icon-mini {
    background: none; border: none; color: var(--muted); font-family: inherit;
    cursor: pointer; padding: 4px 6px; border-radius: 8px;
    display: flex; align-items: center; line-height: 1;
  }
  .icon-mini svg { width: 15px; height: 15px; }
  .icon-mini.edit:hover { color: var(--accent); background: var(--card-soft); }
  .icon-mini.del { font-size: 1.1rem; }
  .icon-mini.del:hover { color: var(--red); background: var(--card-soft); }

  .empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 24px; }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed; inset: 0; background: rgba(2, 6, 23, 0.7);
    display: none; align-items: flex-start; justify-content: center;
    padding: 32px 16px; overflow-y: auto; z-index: 50;
  }
  .modal.open { display: flex; }
  .modal-inner {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 16px; width: 100%; max-width: 720px; padding: 24px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-head h2 { margin: 0; font-size: 1.2rem; font-weight: 600; }
  .close-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 34px; height: 34px; border-radius: 8px; font-size: 1.1rem; line-height: 1; cursor: pointer;
  }
  .close-btn:hover { background: var(--card-soft); color: var(--red); }

  /* ---------- Calendar ---------- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-nav .month-label { font-weight: 600; font-size: 1.05rem; }
  .cal-nav button {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 8px; font-size: 1.1rem; cursor: pointer;
  }
  .cal-nav button:hover { background: var(--card-soft); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-dow {
    text-align: center; font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em; padding-bottom: 4px;
  }
  .cal-day {
    aspect-ratio: 1 / 1; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between; cursor: default;
  }
  .cal-day.blank { background: transparent; border: none; }
  .cal-day.has-hours { cursor: pointer; border-color: var(--accent); }
  .cal-day.has-hours:hover { background: var(--card-soft); }
  .cal-day.today { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cal-day .num { font-size: 0.8rem; color: var(--muted); text-align: right; }
  .cal-day.today .num { color: var(--accent); font-weight: 700; }
  .cal-day .hrs { font-size: 0.9rem; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .day-detail { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .day-detail h3 { margin: 0 0 10px; font-size: 0.95rem; }

  /* ---------- Spreadsheet ---------- */
  .rate-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
  .rate-row label { font-size: 0.85rem; color: var(--muted); }
  .rate-row input, .rate-row select {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 0.95rem; padding: 8px 10px; border-radius: 8px;
  }
  .rate-row input { width: 90px; }
  .rate-row .spacer { flex: 1; }
  .download-btn {
    background: var(--accent); border: none; color: #04283a;
    font-family: inherit; font-weight: 600; font-size: 0.9rem;
    padding: 9px 14px; border-radius: 8px; cursor: pointer;
  }
  .download-btn:hover { filter: brightness(1.08); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th {
    color: var(--muted); font-weight: 600;
    text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.04em;
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; }
  tbody tr:hover { background: var(--card); }
  .muted-note { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 400; }

  /* ---------- Edit form ---------- */
  .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .field input {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 0.95rem; padding: 9px 10px; border-radius: 8px; width: 100%;
  }
  .field input.time-field { cursor: pointer; }
  .field input.time-field:hover { border-color: var(--accent); }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .hint { font-size: 0.78rem; color: var(--muted); margin: -2px 0 16px; }
  .edit-actions { display: flex; align-items: center; gap: 8px; }
  .edit-actions .spacer { flex: 1; }
  .ghost {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-weight: 600; font-size: 0.9rem;
    padding: 9px 14px; border-radius: 8px; cursor: pointer;
  }
  .ghost:hover { background: var(--card-soft); }
  .del-link {
    background: none; border: none; color: var(--red);
    font-family: inherit; font-weight: 600; font-size: 0.9rem;
    padding: 9px 6px; cursor: pointer;
  }
  .del-link:hover { text-decoration: underline; }

  /* ---------- Clock picker ---------- */
  .clock-modal { align-items: center; z-index: 60; }
  .clock-inner {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; width: 100%; max-width: 320px;
  }
  .clock-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .clock-time { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock-time .seg { cursor: pointer; padding: 2px 6px; border-radius: 8px; color: var(--muted); }
  .clock-time .seg.active { color: var(--accent); background: var(--card-soft); }
  .clock-time .colon { color: var(--muted); }
  .clock-mer { display: flex; flex-direction: column; gap: 6px; }
  .clock-mer button {
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    font-family: inherit; font-weight: 700; font-size: 0.85rem;
    padding: 6px 14px; border-radius: 8px; cursor: pointer;
  }
  .clock-mer button.active { background: var(--accent); color: #04283a; border-color: var(--accent); }
  .clock-face { touch-action: none; user-select: none; display: block; width: 260px; max-width: 100%; margin: 0 auto 16px; cursor: pointer; }
  .clock-face svg { display: block; width: 100%; height: auto; }
  .clock-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 480px) {
    body { padding: 20px 12px; }
    .modal { padding: 16px 8px; }
    .modal-inner { padding: 16px; border-radius: 12px; }
    .cal-nav .month-label { font-size: 0.95rem; }
    .cal-nav button { width: 32px; height: 32px; }
    .cal-grid { gap: 4px; }
    .cal-day { padding: 4px; border-radius: 8px; }
    .cal-day .num { font-size: 0.7rem; }
    .cal-day .hrs { font-size: 0.62rem; }
    .cal-dow { font-size: 0.6rem; letter-spacing: 0; }
    th, td { padding: 8px 8px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <h1>Punch Clock</h1>
        <div class="subtitle">Track your work hours &middot; saved locally in this browser</div>
      </div>
      <div class="icons">
        <button class="icon-btn" title="Calendar" onclick="openCalendar()" aria-label="Calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <button class="icon-btn" title="Spreadsheet" onclick="openSheet()" aria-label="Spreadsheet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="status" id="status">Not clocked in</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="started-at" id="startedAt"></div>
      <button class="action btn-start" id="toggleBtn" onclick="toggle()">Start</button>
    </div>

    <div class="summary">
      <div class="stat">
        <div class="stat-value" id="todayTotal">0.00</div>
        <div class="stat-label">Hours Today</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="weekTotal">0.00</div>
        <div class="stat-label">Hours This Week</div>
      </div>
    </div>

    <div class="log-header">
      <h2>History</h2>
      <div class="log-actions">
        <button class="clear-btn add-btn" onclick="openAdd()">+ Add</button>
        <button class="clear-btn" onclick="clearAll()">Clear all</button>
      </div>
    </div>
    <div id="log"></div>
  </div>

  <!-- Calendar modal -->
  <div class="modal" id="calModal" onclick="if(event.target===this)closeCalendar()">
    <div class="modal-inner">
      <div class="modal-head">
        <h2>Calendar</h2>
        <button class="close-btn" onclick="closeCalendar()" aria-label="Close">&times;</button>
      </div>
      <div class="cal-nav">
        <button onclick="changeMonth(-1)" aria-label="Previous month">&lsaquo;</button>
        <div class="month-label" id="monthLabel"></div>
        <button onclick="changeMonth(1)" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="day-detail" id="dayDetail"></div>
    </div>
  </div>

  <!-- Spreadsheet modal -->
  <div class="modal" id="sheetModal" onclick="if(event.target===this)closeSheet()">
    <div class="modal-inner">
      <div class="modal-head">
        <h2>Timesheet</h2>
        <button class="close-btn" onclick="closeSheet()" aria-label="Close">&times;</button>
      </div>
      <div class="rate-row">
        <label for="currency">Currency</label>
        <select id="currency" onchange="onRateChange()">
          <option value="&euro;">&euro;</option>
          <option value="$">$</option>
          <option value="&pound;">&pound;</option>
        </select>
        <label for="rate">Hourly pay</label>
        <input type="number" id="rate" min="0" step="0.01" placeholder="0.00" oninput="onRateChange()" />
        <span class="spacer"></span>
        <button class="download-btn" onclick="downloadCSV()">Download CSV</button>
      </div>
      <div class="table-wrap">
        <table id="sheetTable"></table>
      </div>
    </div>
  </div>

  <!-- Edit / Add modal -->
  <div class="modal" id="editModal" onclick="if(event.target===this)closeEdit()">
    <div class="modal-inner" style="max-width:420px">
      <div class="modal-head">
        <h2 id="editTitle">Edit session</h2>
        <button class="close-btn" onclick="closeEdit()" aria-label="Close">&times;</button>
      </div>
      <div class="field">
        <label for="editDate">Date</label>
        <input type="date" id="editDate" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="editStartDisp">Start</label>
          <input type="text" id="editStartDisp" class="time-field" readonly placeholder="Tap to set" onclick="openClock('start')" />
        </div>
        <div class="field">
          <label for="editEndDisp">End</label>
          <input type="text" id="editEndDisp" class="time-field" readonly placeholder="Tap to set" onclick="openClock('end')" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="editBonus">Bonus (<span id="editCur">&euro;</span>)</label>
          <input type="number" id="editBonus" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div class="field">
          <label for="editNote">Note</label>
          <input type="text" id="editNote" placeholder="e.g. Gas" />
        </div>
      </div>
      <div class="hint">If End is earlier than Start, it counts as the next day (overnight shift).</div>
      <div class="edit-actions">
        <button class="del-link" id="editDelete" onclick="deleteFromEdit()">Delete</button>
        <span class="spacer"></span>
        <button class="ghost" onclick="closeEdit()">Cancel</button>
        <button class="download-btn" onclick="saveEdit()">Save</button>
      </div>
    </div>
  </div>

  <!-- Clock picker modal -->
  <div class="modal clock-modal" id="clockModal" onclick="if(event.target===this)closeClock()">
    <div class="clock-inner">
      <div class="clock-head">
        <div class="clock-time">
          <span id="clockHour" class="seg active" onclick="setClockMode('hours')">09</span><span class="colon">:</span><span id="clockMin" class="seg" onclick="setClockMode('minutes')">00</span>
        </div>
        <div class="clock-mer">
          <button id="merAM" onclick="setMer('AM')">AM</button>
          <button id="merPM" onclick="setMer('PM')">PM</button>
        </div>
      </div>
      <div class="clock-face" id="clockFace"></div>
      <div class="clock-actions">
        <button class="ghost" onclick="closeClock()">Cancel</button>
        <button class="download-btn" onclick="confirmClock()">OK</button>
      </div>
    </div>
  </div>

<script>
  const LOG_KEY = "punchclock.entries";
  const ACTIVE_KEY = "punchclock.active";
  const RATE_KEY = "punchclock.rate";
  const CUR_KEY = "punchclock.currency";

  let entries = load(LOG_KEY, []);
  let activeStart = load(ACTIVE_KEY, null);
  let tick = null;

  let calCursor = new Date(); calCursor.setDate(1);
  let calSelectedKey = null;
  let editingIndex = null;
  let editTimes = { start: null, end: null }; // minutes since midnight, or null

  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  }
  function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- Clock (punch) ---------- */
  function toggle() {
    if (activeStart === null) {
      activeStart = Date.now();
      save(ACTIVE_KEY, activeStart);
      startTick();
    } else {
      const end = Date.now();
      entries.unshift({ start: activeStart, end, bonus: 0, note: "" });
      save(LOG_KEY, entries);
      activeStart = null;
      localStorage.removeItem(ACTIVE_KEY);
      stopTick();
    }
    render();
  }
  function startTick() { stopTick(); tick = setInterval(updateTimer, 1000); updateTimer(); }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
  function updateTimer() {
    const elapsed = activeStart === null ? 0 : Date.now() - activeStart;
    document.getElementById("timer").textContent = formatDuration(elapsed);
  }

  /* ---------- Helpers ---------- */
  function formatDuration(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
    const s = String(totalSec % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }
  function hoursOf(e) { return (e.end - e.start) / 3600000; }
  function bonusOf(e) { const b = Number(e.bonus); return isNaN(b) ? 0 : b; }
  function noteOf(e) { return e.note || ""; }
  function payOf(e, rate) { return hoursOf(e) * rate + bonusOf(e); }

  function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function fmtDate(ts) { return new Date(ts).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }); }
  function weekday(ts) { return new Date(ts).toLocaleDateString([], { weekday: "long" }); }
  function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }

  function startOfToday() { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
  function startOfWeek() {
    const d = new Date(); d.setHours(0,0,0,0);
    const day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    return d.getTime();
  }
  function getRate() { const r = parseFloat(load(RATE_KEY, 0)); return isNaN(r) ? 0 : r; }
  function getCurrency() { return load(CUR_KEY, "€"); }
  function sortEntriesDesc() { entries.sort((a, b) => b.start - a.start); }

  function toDateInput(ts) {
    const d = new Date(ts);
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function minutesOfDay(ts) { const d = new Date(ts); return d.getHours() * 60 + d.getMinutes(); }
  function tsFromDateMin(dateStr, min) {
    const [y, mo, d] = dateStr.split("-").map(Number);
    return new Date(y, mo - 1, d, Math.floor(min / 60), min % 60, 0, 0).getTime();
  }

  // 12h <-> minutes-since-midnight conversions
  function minutesToParts(min) {
    const h24 = Math.floor(min / 60), m = min % 60;
    const mer = h24 < 12 ? "AM" : "PM";
    let hour12 = h24 % 12; if (hour12 === 0) hour12 = 12;
    return { hour12, minute: m, mer };
  }
  function partsToMinutes(hour12, minute, mer) {
    let h24 = hour12 % 12;
    if (mer === "PM") h24 += 12;
    return h24 * 60 + minute;
  }
  function fmt12(min) {
    const p = minutesToParts(min);
    return `${p.hour12}:${String(p.minute).padStart(2, "0")} ${p.mer}`;
  }

  /* ---------- History mutations ---------- */
  function deleteEntry(index) {
    entries.splice(index, 1);
    save(LOG_KEY, entries);
    render();
  }
  function clearAll() {
    if (!entries.length) return;
    if (!confirm("Delete all history? This cannot be undone.")) return;
    entries = [];
    save(LOG_KEY, entries);
    render();
  }

  /* ---------- Edit / Add ---------- */
  function updateTimeDisplays() {
    document.getElementById("editStartDisp").value = editTimes.start == null ? "" : fmt12(editTimes.start);
    document.getElementById("editEndDisp").value = editTimes.end == null ? "" : fmt12(editTimes.end);
  }

  function openAdd() {
    editingIndex = null;
    document.getElementById("editTitle").textContent = "Add session";
    document.getElementById("editDelete").style.display = "none";
    document.getElementById("editDate").value = toDateInput(Date.now());
    editTimes = { start: null, end: null };
    document.getElementById("editBonus").value = "";
    document.getElementById("editNote").value = "";
    document.getElementById("editCur").innerHTML = getCurrency();
    updateTimeDisplays();
    document.getElementById("editModal").classList.add("open");
  }

  function openEdit(index) {
    editingIndex = index;
    const e = entries[index];
    document.getElementById("editTitle").textContent = "Edit session";
    document.getElementById("editDelete").style.display = "";
    document.getElementById("editDate").value = toDateInput(e.start);
    editTimes = { start: minutesOfDay(e.start), end: minutesOfDay(e.end) };
    document.getElementById("editBonus").value = bonusOf(e) ? bonusOf(e) : "";
    document.getElementById("editNote").value = noteOf(e);
    document.getElementById("editCur").innerHTML = getCurrency();
    updateTimeDisplays();
    document.getElementById("editModal").classList.add("open");
  }

  function closeEdit() { document.getElementById("editModal").classList.remove("open"); }

  function saveEdit() {
    const dateStr = document.getElementById("editDate").value;
    if (!dateStr || editTimes.start == null || editTimes.end == null) {
      alert("Please set the date, start time and end time.");
      return;
    }
    let start = tsFromDateMin(dateStr, editTimes.start);
    let end = tsFromDateMin(dateStr, editTimes.end);
    if (end <= start) end += 24 * 3600000; // overnight shift

    const bonus = parseFloat(document.getElementById("editBonus").value) || 0;
    const note = document.getElementById("editNote").value.trim();
    const entry = { start, end, bonus, note };

    if (editingIndex === null) entries.push(entry);
    else entries[editingIndex] = entry;

    sortEntriesDesc();
    save(LOG_KEY, entries);
    closeEdit();
    render();
  }

  function deleteFromEdit() {
    if (editingIndex === null) { closeEdit(); return; }
    if (!confirm("Delete this session?")) return;
    entries.splice(editingIndex, 1);
    save(LOG_KEY, entries);
    closeEdit();
    render();
  }

  /* ---------- Clock picker ---------- */
  const picker = { target: "start", hour12: 9, minute: 0, mer: "AM", mode: "hours" };
  const faceEl = document.getElementById("clockFace");

  function openClock(target) {
    picker.target = target;
    const cur = editTimes[target];
    const base = cur == null ? (target === "start" ? 9 * 60 : 17 * 60) : cur;
    const p = minutesToParts(base);
    picker.hour12 = p.hour12; picker.minute = p.minute; picker.mer = p.mer; picker.mode = "hours";
    renderClock();
    document.getElementById("clockModal").classList.add("open");
  }
  function closeClock() { document.getElementById("clockModal").classList.remove("open"); }
  function setClockMode(mode) { picker.mode = mode; renderClock(); }
  function setMer(m) { picker.mer = m; renderClock(); }
  function confirmClock() {
    editTimes[picker.target] = partsToMinutes(picker.hour12, picker.minute, picker.mer);
    updateTimeDisplays();
    closeClock();
  }

  function renderClock() {
    document.getElementById("clockHour").textContent = String(picker.hour12).padStart(2, "0");
    document.getElementById("clockMin").textContent = String(picker.minute).padStart(2, "0");
    document.getElementById("clockHour").classList.toggle("active", picker.mode === "hours");
    document.getElementById("clockMin").classList.toggle("active", picker.mode === "minutes");
    document.getElementById("merAM").classList.toggle("active", picker.mer === "AM");
    document.getElementById("merPM").classList.toggle("active", picker.mer === "PM");

    const cx = 130, cy = 130, R = 104;
    const CLR = { text: "#e2e8f0", sel: "#04283a", accent: "#38bdf8", face: "#1e293b", border: "#334155", muted: "#94a3b8" };

    // selected angle + hand endpoint
    const selValueAngle = picker.mode === "hours"
      ? (picker.hour12 % 12) * 30
      : picker.minute * 6;
    const rad = selValueAngle * Math.PI / 180;
    const hx = cx + R * Math.sin(rad);
    const hy = cy - R * Math.cos(rad);

    let svg = `<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<circle cx="${cx}" cy="${cy}" r="126" fill="${CLR.face}" stroke="${CLR.border}"/>`;
    svg += `<line x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="${CLR.accent}" stroke-width="2"/>`;
    svg += `<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="18" fill="${CLR.accent}"/>`;

    if (picker.mode === "hours") {
      for (let n = 1; n <= 12; n++) {
        const a = n * 30 * Math.PI / 180;
        const x = cx + R * Math.sin(a);
        const y = cy - R * Math.cos(a);
        const sel = n === picker.hour12;
        svg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="17" font-family="system-ui,sans-serif" font-weight="${sel ? 700 : 500}" fill="${sel ? CLR.sel : CLR.text}">${n}</text>`;
      }
    } else {
      for (let v = 0; v < 60; v += 5) {
        const a = v * 6 * Math.PI / 180;
        const x = cx + R * Math.sin(a);
        const y = cy - R * Math.cos(a);
        const sel = v === picker.minute;
        svg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="15" font-family="system-ui,sans-serif" font-weight="${sel ? 700 : 500}" fill="${sel ? CLR.sel : CLR.text}">${String(v).padStart(2, "0")}</text>`;
      }
    }
    svg += `<circle cx="${cx}" cy="${cy}" r="3" fill="${CLR.accent}"/>`;
    svg += `</svg>`;
    faceEl.innerHTML = svg;
  }

  function clockPointer(evt, isUp) {
    const rect = faceEl.getBoundingClientRect();
    const x = (evt.clientX - rect.left) / rect.width * 260;
    const y = (evt.clientY - rect.top) / rect.height * 260;
    let deg = Math.atan2(x - 130, -(y - 130)) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    if (picker.mode === "hours") {
      let h = Math.round(deg / 30) % 12; if (h === 0) h = 12;
      picker.hour12 = h;
    } else {
      picker.minute = Math.round(deg / 6) % 60;
    }
    renderClock();
    if (isUp && picker.mode === "hours") { picker.mode = "minutes"; renderClock(); }
  }

  let clockDragging = false;
  faceEl.addEventListener("pointerdown", e => {
    clockDragging = true;
    try { faceEl.setPointerCapture(e.pointerId); } catch {}
    clockPointer(e, false);
  });
  faceEl.addEventListener("pointermove", e => { if (clockDragging) clockPointer(e, false); });
  faceEl.addEventListener("pointerup", e => {
    if (clockDragging) { clockDragging = false; clockPointer(e, true); }
  });
  faceEl.addEventListener("pointercancel", () => { clockDragging = false; });

  /* ---------- Main render ---------- */
  function render() {
    const active = activeStart !== null;
    const status = document.getElementById("status");
    const btn = document.getElementById("toggleBtn");
    const startedAt = document.getElementById("startedAt");

    if (active) {
      status.textContent = "Clocked in";
      status.classList.add("active");
      btn.textContent = "End";
      btn.className = "action btn-end";
      startedAt.textContent = "Started at " + fmtTime(activeStart);
    } else {
      status.textContent = "Not clocked in";
      status.classList.remove("active");
      btn.textContent = "Start";
      btn.className = "action btn-start";
      startedAt.textContent = "";
    }
    updateTimer();

    const todayStart = startOfToday();
    const weekStart = startOfWeek();
    let todayH = 0, weekH = 0;
    for (const e of entries) {
      const h = hoursOf(e);
      if (e.start >= todayStart) todayH += h;
      if (e.start >= weekStart) weekH += h;
    }
    document.getElementById("todayTotal").textContent = todayH.toFixed(2);
    document.getElementById("weekTotal").textContent = weekH.toFixed(2);

    const cur = getCurrency();
    const log = document.getElementById("log");
    if (!entries.length) {
      log.innerHTML = '<div class="empty">No sessions yet. Press Start to clock in.</div>';
    } else {
      log.innerHTML = entries.map((e, i) => {
        const bonusLine = bonusOf(e) > 0
          ? `<div class="entry-bonus">+ ${cur}${bonusOf(e).toFixed(2)}${noteOf(e) ? " &middot; " + esc(noteOf(e)) : ""}</div>`
          : "";
        return `
        <div class="entry">
          <div class="entry-info">
            <div class="entry-date">${fmtDate(e.start)}</div>
            <div class="entry-times">${fmtTime(e.start)} &rarr; ${fmtTime(e.end)}</div>
            ${bonusLine}
          </div>
          <div class="entry-actions">
            <div class="entry-hours">${hoursOf(e).toFixed(2)} h</div>
            <button class="icon-mini edit" onclick="openEdit(${i})" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon-mini del" onclick="deleteEntry(${i})" title="Delete">&times;</button>
          </div>
        </div>`;
      }).join("");
    }

    if (document.getElementById("calModal").classList.contains("open")) renderCalendar();
    if (document.getElementById("sheetModal").classList.contains("open")) renderSheet();
  }

  /* ---------- Calendar ---------- */
  function openCalendar() {
    calSelectedKey = null;
    calCursor = new Date(); calCursor.setDate(1);
    renderCalendar();
    document.getElementById("calModal").classList.add("open");
  }
  function closeCalendar() { document.getElementById("calModal").classList.remove("open"); }
  function changeMonth(delta) {
    calCursor.setMonth(calCursor.getMonth() + delta);
    calSelectedKey = null;
    renderCalendar();
  }
  function groupByDay() {
    const map = {};
    for (const e of entries) { const k = dayKey(e.start); (map[k] = map[k] || []).push(e); }
    return map;
  }
  function renderCalendar() {
    const year = calCursor.getFullYear();
    const month = calCursor.getMonth();
    document.getElementById("monthLabel").textContent =
      calCursor.toLocaleDateString([], { month: "long", year: "numeric" });

    const byDay = groupByDay();
    const todayKey = dayKey(Date.now());
    const dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    let cells = dows.map(d => `<div class="cal-dow">${d}</div>`).join("");

    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let i = 0; i < firstDow; i++) cells += '<div class="cal-day blank"></div>';

    for (let d = 1; d <= daysInMonth; d++) {
      const k = year + "-" + month + "-" + d;
      const list = byDay[k] || [];
      const hrs = list.reduce((sum, e) => sum + hoursOf(e), 0);
      const cls = ["cal-day"];
      if (hrs > 0) cls.push("has-hours");
      if (k === todayKey) cls.push("today");
      const click = hrs > 0 ? ` onclick="selectDay('${k}')"` : "";
      cells += `<div class="${cls.join(" ")}"${click}>
        <div class="num">${d}</div>
        <div class="hrs">${hrs > 0 ? hrs.toFixed(2) + " h" : ""}</div>
      </div>`;
    }
    document.getElementById("calGrid").innerHTML = cells;
    renderDayDetail();
  }
  function selectDay(k) { calSelectedKey = k; renderDayDetail(); }
  function renderDayDetail() {
    const box = document.getElementById("dayDetail");
    if (!calSelectedKey) { box.innerHTML = ""; return; }
    const list = (groupByDay()[calSelectedKey] || []).slice().sort((a, b) => a.start - b.start);
    if (!list.length) { box.innerHTML = ""; return; }

    const rate = getRate();
    const cur = getCurrency();
    const totalH = list.reduce((s, e) => s + hoursOf(e), 0);
    const totalPay = list.reduce((s, e) => s + payOf(e, rate), 0);
    const label = new Date(list[0].start).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    const payStr = rate > 0 ? ` &middot; ${cur}${totalPay.toFixed(2)}` : "";

    box.innerHTML = `<h3>${label} &mdash; ${totalH.toFixed(2)} h${payStr}</h3>` +
      list.map(e => {
        const bonusLine = bonusOf(e) > 0
          ? `<div class="entry-bonus">+ ${cur}${bonusOf(e).toFixed(2)}${noteOf(e) ? " &middot; " + esc(noteOf(e)) : ""}</div>`
          : "";
        return `
        <div class="entry">
          <div class="entry-info">
            <div class="entry-times">${fmtTime(e.start)} &rarr; ${fmtTime(e.end)}</div>
            ${bonusLine}
          </div>
          <div class="entry-hours">${hoursOf(e).toFixed(2)} h</div>
        </div>`;
      }).join("");
  }

  /* ---------- Spreadsheet ---------- */
  function openSheet() {
    document.getElementById("rate").value = getRate() ? getRate() : "";
    document.getElementById("currency").value = getCurrency();
    renderSheet();
    document.getElementById("sheetModal").classList.add("open");
  }
  function closeSheet() { document.getElementById("sheetModal").classList.remove("open"); }
  function onRateChange() {
    const r = parseFloat(document.getElementById("rate").value);
    save(RATE_KEY, isNaN(r) ? 0 : r);
    save(CUR_KEY, document.getElementById("currency").value);
    renderSheet();
  }
  function sheetRows() { return entries.slice().sort((a, b) => a.start - b.start); }
  function renderSheet() {
    const rate = getRate();
    const cur = getCurrency();
    const rows = sheetRows();
    const table = document.getElementById("sheetTable");

    if (!rows.length) {
      table.innerHTML = '<tbody><tr><td class="empty">No sessions yet.</td></tr></tbody>';
      return;
    }

    let totalH = 0, totalBonus = 0, totalPay = 0;
    const body = rows.map(e => {
      const h = hoursOf(e);
      const b = bonusOf(e);
      const pay = h * rate + b;
      totalH += h; totalBonus += b; totalPay += pay;
      const bonusCell = b > 0
        ? `${cur}${b.toFixed(2)}${noteOf(e) ? `<span class="muted-note">${esc(noteOf(e))}</span>` : ""}`
        : "&mdash;";
      return `<tr>
        <td>${new Date(e.start).toLocaleDateString()}</td>
        <td>${weekday(e.start)}</td>
        <td>${fmtTime(e.start)}</td>
        <td>${fmtTime(e.end)}</td>
        <td class="num">${h.toFixed(2)}</td>
        <td class="num">${bonusCell}</td>
        <td class="num">${cur}${pay.toFixed(2)}</td>
      </tr>`;
    }).join("");

    table.innerHTML = `
      <thead>
        <tr>
          <th>Date</th><th>Day</th><th>Start</th><th>Finish</th>
          <th class="num">Total (h)</th><th class="num">Bonus</th><th class="num">Pay</th>
        </tr>
      </thead>
      <tbody>${body}</tbody>
      <tfoot>
        <tr>
          <td colspan="4">Total</td>
          <td class="num">${totalH.toFixed(2)}</td>
          <td class="num">${cur}${totalBonus.toFixed(2)}</td>
          <td class="num">${cur}${totalPay.toFixed(2)}</td>
        </tr>
      </tfoot>`;
  }

  function csvCell(v) {
    v = String(v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function downloadCSV() {
    const rate = getRate();
    const cur = getCurrency();
    const rows = sheetRows();
    const header = ["Date", "Day", "Start", "Finish", "Total (h)", "Bonus (" + cur + ")", "Note", "Pay (" + cur + ")"];
    const lines = [header.map(csvCell).join(",")];

    let totalH = 0, totalBonus = 0, totalPay = 0;
    for (const e of rows) {
      const h = hoursOf(e);
      const b = bonusOf(e);
      const pay = h * rate + b;
      totalH += h; totalBonus += b; totalPay += pay;
      lines.push([
        new Date(e.start).toLocaleDateString(),
        weekday(e.start),
        fmtTime(e.start),
        fmtTime(e.end),
        h.toFixed(2),
        b.toFixed(2),
        noteOf(e),
        pay.toFixed(2)
      ].map(csvCell).join(","));
    }
    lines.push(["Total", "", "", "", totalH.toFixed(2), totalBonus.toFixed(2), "", totalPay.toFixed(2)]
      .map(csvCell).join(","));

    const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "punch-clock-timesheet.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (document.getElementById("clockModal").classList.contains("open")) { closeClock(); return; }
    closeCalendar(); closeSheet(); closeEdit();
  });

  if (activeStart !== null) startTick();
  render();
</script>
</body>
</html>
